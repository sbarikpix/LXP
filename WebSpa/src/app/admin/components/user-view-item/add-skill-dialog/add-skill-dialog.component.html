<div class="p-3" *ngIf="!loading">
    <form [formGroup]="skillsFormGroup">
        <h2 class="text-center">Add Skill Level</h2>

        <div class="d-flex justify-content-sm-around dialog-mob">
            <mat-form-field class="interestField" appearance="outline">
                <mat-label>Selected Skill</mat-label>
                <input type="text" readonly="true" matInput formControlName="skills" />
            </mat-form-field>

            <mat-form-field class="interestField" appearance="outline">
                <mat-label>Level</mat-label>
                <mat-select formControlName="level">
                    <mat-option *ngFor="let level of levels" [value]="level">{{ level }}</mat-option>
                </mat-select>
            </mat-form-field>

        </div>

        <div class="d-flex justify-content-end">
            <button mat-stroked-button color="light" class="btns" id="back-btn" (click)="closeDialog()">Cancel</button>
            <button mat-flat-button color="warn" class="btns" id="save-btn" (click)="saveSkills()">Save</button>
        </div>
    </form>
</div>

<div class="loader" *ngIf="loading">

</div>
