<div *ngIf="!loading" style="background-color:#fdfefe; height: 500px;">

    <div class="tabgroup-div">
        <mat-tab-group [(selectedIndex)]="selectedTab" (selectedTabChange)="tabChange($event)" color="warn">
            <!-- Web URL Tab -->
            <div class="tab-div">
                <mat-tab label="Web URL">
                    <form [formGroup]="uploadForm" class="web-url-form">
                        <div class="upload-form-div">
                            <label for="webUrl" class="form-label">Enter link address <i class="faded">*</i></label>
                            <input formControlName="webUrl" type="text" class="form-control" id="webUrl"
                                placeholder="Enter link address here"
                                [class.is-invalid]="uploadForm.get('webUrl')?.invalid && uploadForm.get('webUrl')?.touched">

                            <!-- Required Error -->
                            <div class="invalid-feedback"
                                *ngIf="uploadForm.get('webUrl')?.hasError('required') && uploadForm.get('webUrl')?.touched">
                                Web Url is required.
                            </div>

                            <!-- Invalid URL Error -->
                            <div class="invalid-feedback"
                                *ngIf="uploadForm.get('webUrl')?.touched && uploadForm.get('webUrl')?.hasError('pattern')">
                                Please enter a valid URL.
                            </div>
                        </div>


                        <div class="file-upload-container upload-form-div">
                            <label class="file-label">Upload Thumbnail (Optional) <span class="text-muted">(Max: 5
                                    MB)</span></label>
                            <input #fileInput class="form-control" type="file" (change)="onImageSelected($event)"
                                accept="image/*">
                        </div>

                        <div class="mt-3 upload-form-div">
                            <label for="title" class="form-label">Title <i class="faded">*</i></label>
                            <input formControlName="title" type="text" class="form-control" id="title"
                                placeholder="Enter SmartCard title"
                                [class.is-invalid]="uploadForm.get('title')?.invalid && uploadForm.get('title')?.touched">

                            <!-- Required Error -->
                            <div class="invalid-feedback"
                                *ngIf="uploadForm.get('title')?.hasError('required') && uploadForm.get('title')?.touched">
                                Title is required.
                            </div>

                        </div>
                        <div class="mt-3 upload-form-div">
                            <label for="description" class="form-label">Description</label>
                            <textarea formControlName="description" class="form-control" id="description"
                                style="max-height: 150px;" placeholder="Enter description (optional)">
                            </textarea>
                        </div>

                        <div class="mt-3 upload-form-div" *ngIf="!isEditMode">
                            <label for="selectedSkill" class="form-label">Select Skill <i
                                    class="text-muted">*</i></label>
                            <input type="text" class="form-control" matInput #skillInput [matAutocomplete]="autoSkill"
                                [value]="selectedSkill" placeholder="Search Skill" formControlName="selectedSkill"
                                (input)="onSearchInput($event)"
                                [class.is-invalid]="uploadForm.get('selectedSkill')?.invalid && uploadForm.get('selectedSkill')?.touched">
                            <mat-autocomplete #autoSkill="matAutocomplete"
                                (optionSelected)="onSkillValueChanged($event.option.value)">
                                <div infiniteScroll [infiniteScrollDistance]="2" [infiniteScrollThrottle]="500"
                                    [scrollWindow]="false" (scrolled)="onDropDownScroll()" class="dropdown-scroll">
                                    <mat-option *ngFor="let skill of filterskills | async" [value]="skill">
                                        {{ skill.name }}
                                    </mat-option>
                                </div>
                            </mat-autocomplete>
                            <div class="invalid-feedback" *ngIf="uploadForm.get('selectedSkill')?.hasError('required')">
                                Skill is required.
                            </div>
                        </div>

                        <div *ngIf="isEditMode" class="mt-3 upload-form-div" appearance="outline">
                            <label class="form-label">Select Skill</label>
                            <input type="text" formControlName="selectedSkill" class="form-control" readonly>
                        </div>

                        <div class="mt-3 mb-1 upload-form-div" *ngIf="!isEditMode ">
                            <label for="selectedSkillLevel" class="form-label">Select Skill Level<i
                                    class="text-muted">*</i></label>
                            <input type="text" class="form-control" matInput #levelInput [matAutocomplete]="autoLevel"
                                [value]="selectedSkillLevel" placeholder="Select skill level"
                                formControlName="selectedSkillLevel"
                                [class.is-invalid]="uploadForm.get('selectedSkillLevel')?.invalid && uploadForm.get('selectedSkillLevel')?.touched">
                            <mat-autocomplete #autoLevel="matAutocomplete"
                                (optionSelected)="onLevelValueChanged($event.option.value)">
                                <mat-option *ngFor="let level of filterskillLevels | async" [value]="level">
                                    {{ level.levelValue }}
                                </mat-option>
                            </mat-autocomplete>
                            <div class="invalid-feedback"
                                *ngIf="uploadForm.get('selectedSkillLevel')?.hasError('required')">
                                Skill Level is required.
                            </div>
                        </div>

                        <div *ngIf="isEditMode" class="mt-3 mb-1 upload-form-div" appearance="outline">
                            <label class="form-label">Select Skill Level</label>
                            <input class="form-control" type="text" formControlName="selectedSkillLevel" readonly>
                        </div>

                    </form>
                </mat-tab>
            </div>
            <!-- Upload Content Tab -->
            <div class="tab-div">
                <mat-tab label="Upload Content">
                    <form [formGroup]="uploadForm" class="web-url-form">
                        <div class="file-upload-container upload-form-div">
                            <label class="file-label">Upload Content <span class="text-muted">(Max: 10
                                    MB)</span></label>
                            <input #fileInput class="form-control" type="file" (change)="onFileSelected($event)"
                                accept=".pdf,.doc,.docx,.mp4,.avi,.txt">
                            <mat-error *ngIf="fileError">{{ fileError }}</mat-error>
                        </div>

                        <div class="file-upload-container upload-form-div">
                            <label class="file-label">Upload Thumbnail (Optional) <span class="text-muted">(Max: 5
                                    MB)</span></label>
                            <input #fileInput class="form-control" type="file" (change)="onImageSelected($event)"
                                accept="image/*">
                        </div>

                        <div class="mt-3 upload-form-div">
                            <label for="title" class="form-label">Title <i class="faded">*</i></label>
                            <input formControlName="title" type="text" class="form-control" id="title"
                                placeholder="Enter SmartCard title"
                                [class.is-invalid]="uploadForm.get('title')?.invalid && uploadForm.get('title')?.touched">

                            <!-- Required Error -->
                            <div class="invalid-feedback"
                                *ngIf="uploadForm.get('title')?.hasError('required') && uploadForm.get('title')?.touched">
                                Title is required.
                            </div>

                        </div>

                        <div class="mt-3 upload-form-div">
                            <label for="description" class="form-label">Description</label>
                            <textarea formControlName="description" class="form-control" id="description"
                                style="max-height: 150px;" placeholder="Enter description (optional)">
                            </textarea>
                        </div>

                        <div class="mt-3 upload-form-div" *ngIf="!isEditMode">
                            <label for="selectedSkill" class="form-label">Select Skill <i
                                    class="text-muted">*</i></label>
                            <input type="text" class="form-control" matInput #skillInput [matAutocomplete]="autoSkill"
                                [value]="selectedSkill" placeholder="Search Skill" formControlName="selectedSkill"
                                (input)="onSearchInput($event)"
                                [class.is-invalid]="uploadForm.get('selectedSkill')?.invalid && uploadForm.get('selectedSkill')?.touched">
                            <mat-autocomplete #autoSkill="matAutocomplete"
                                (optionSelected)="onSkillValueChanged($event.option.value)">
                                <div infiniteScroll [infiniteScrollDistance]="2" [infiniteScrollThrottle]="500"
                                    [scrollWindow]="false" (scrolled)="onDropDownScroll()" class="dropdown-scroll">
                                    <mat-option *ngFor="let skill of filterskills | async" [value]="skill">
                                        {{ skill.name }}
                                    </mat-option>
                                </div>
                            </mat-autocomplete>
                            <div class="invalid-feedback" *ngIf="uploadForm.get('selectedSkill')?.hasError('required')">
                                Skill is required.
                            </div>
                        </div>

                        <div *ngIf="isEditMode" class="mt-3 upload-form-div" appearance="outline">
                            <label class="form-label">Select Skill</label>
                            <input type="text" formControlName="selectedSkill" class="form-control" readonly>
                        </div>

                        <div class="mt-3 mb-1 upload-form-div" *ngIf="!isEditMode">
                            <label for="selectedSkillLevel" class="form-label">Select Skill Level<i
                                    class="text-muted">*</i></label>
                            <input type="text" class="form-control" matInput #levelInput [matAutocomplete]="autoLevel"
                                [value]="selectedSkillLevel" placeholder="Select skill level"
                                formControlName="selectedSkillLevel"
                                [class.is-invalid]="uploadForm.get('selectedSkillLevel')?.invalid && uploadForm.get('selectedSkillLevel')?.touched">
                            <mat-autocomplete #autoLevel="matAutocomplete"
                                (optionSelected)="onLevelValueChanged($event.option.value)">
                                <mat-option *ngFor="let level of filterskillLevels | async" [value]="level">
                                    {{ level.levelValue }}
                                </mat-option>
                            </mat-autocomplete>
                            <div class="invalid-feedback"
                                *ngIf="uploadForm.get('selectedSkillLevel')?.hasError('required')">
                                Skill Level is required.
                            </div>
                        </div>

                        <div *ngIf="isEditMode" class="mt-3 mb-1 upload-form-div" appearance="outline">
                            <label class="form-label">Select Skill Level</label>
                            <input class="form-control" type="text" formControlName="selectedSkillLevel" readonly>
                        </div>
                    </form>
                </mat-tab>
            </div>
        </mat-tab-group>
    </div>
    <div class="dialog-actions" *ngIf="!isEditMode">
        <button class="cancel-btn" (click)="closeDialog()">Cancel</button>
        <button class="submit-btn" [disabled]="!isFormValid()" (click)="submitSmartCard()">Create
            Content</button>
    </div>
    <div class="dialog-actions" *ngIf="isEditMode">
        <button class="cancel-btn" (click)="closeDialog()">Cancel</button>
        <button class="submit-btn" (click)="updateContent()">Update Content</button>
    </div>
</div>
<div class="loader" *ngIf="loading">

</div>
