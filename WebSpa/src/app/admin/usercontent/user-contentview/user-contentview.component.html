<div class="col-md-12 main-container" *ngIf="!loading">
    <div class="col-md-12">
        <div *ngIf="searchusercontent.length !==0" class="fs-5 fw-medium ms-4 page-header-mob">All Learning</div>
        <div class="ms-2 d-flex justify-content-between align-items-center content-top-mob">
            <div *ngIf="searchusercontent.length !==0" class="search-bar-mob">
                <mat-form-field class="underline-search-bar" *ngIf="!isMobile">
                    <input matInput placeholder="Type to search" [(ngModel)]="searchValue" (input)="filterList($event)">
                    <mat-icon matSuffix>search</mat-icon>
                </mat-form-field>
                <mat-form-field appearance="outline" class="mt-2 w-100 " *ngIf="isMobile">
                    <div class="d-flex align-items-center gap-2 w-100">
                        <i class="fa-solid fa-search"></i>
                        <input matInput placeholder="Type to search" class="w-100" [(ngModel)]="searchValue"
                            (input)="filterList($event)">
                    </div>
                </mat-form-field>
            </div>
            <div>
                <button class="btn-start" (click)="openAddContentDialog()">
                    Add Content
                </button>
            </div>

        </div>
        <div class="mt-2" *ngIf="searchusercontent.length !==0">
            <div class="row content-row-mob">
                <div class="col-md-3" id="course-main" *ngFor="let content of usercontent">
                    <div class="card position-relative">
                        <img [src]="content.thumbnail" class="card-img-top" alt="Course image"
                            *ngIf="content.thumbnail.length > 0">
                        <img src="https://chasmadevstore.blob.core.windows.net/public/defaultcontent.jpg"
                            class="card-img-top" alt="Course image" *ngIf="content.thumbnail.length <= 0">

                        <div class="d-flex" style="align-items: center;justify-content: center;padding: 15px;">
                            <span class="col-5 badge ms-3" [matTooltip]="content.skillName"
                                [class]="content.skillName">{{
                                content.skillName
                                }}</span>
                            <span class="col-5 badge ms-3" [matTooltip]="content.levelName"
                                [class]="content.levelName">{{
                                content.levelName }}</span>
                            <button mat-icon-button [matMenuTriggerFor]="menu" class="col-2">
                                <mat-icon class="custom-icon" style="color: black;">more_vert</mat-icon>
                            </button>
                            <mat-menu #menu="matMenu">
                                <button mat-menu-item (click)="onassign(content)">Assign</button>
                                <button mat-menu-item (click)="onEdit(content)">Edit</button>
                            </mat-menu>
                        </div>
                        <!-- <div class="text-end">

                        </div> -->
                        <div class="card-body d-flex">
                            <div class="title-txt">
                                <span [matTooltip]="content.title" class="card-title">Title : {{ content.title }}</span>
                                <ng-container
                                    *ngIf="content.description && content.description != 'null'; else noDescription">
                                    <span [matTooltip]="content.description">
                                        Description: {{ content.description }}
                                    </span>
                                </ng-container>
                                <ng-template #noDescription>
                                    <span>Description: Not available</span>
                                </ng-template>
                            </div>
                        </div>
                        <div class="btn-div">
                            <!-- <button class="btn-assign" (click)="onassign(content)">Assign</button>
                            <button class="btn-start" (click)="onEdit(content)">Edit</button> -->
                            <button class="btn-start" (click)="onstart(content.contentPath)">Start</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="text-center" *ngIf="usercontent.length ===0">
                No Content available
            </div>
        </div>
        <div class="text-center" *ngIf="searchusercontent.length ===0">
            <img src="https://chasmadevstore.blob.core.windows.net/public/novo_Cources-Not-found-page.png"
                style="width: 100%;" alt="No content available">
        </div>
    </div>
</div>
<div class="loader" *ngIf="loading">

</div>
